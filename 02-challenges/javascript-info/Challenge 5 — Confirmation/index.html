<!-- Challenge 5 — Confirmation

Use confirm() to ask:

"Are you learning JavaScript?"

If the user clicks OK, show:

Great! Keep learning!

If they click Cancel:

No problem. You can start anytime!

Important: You haven't learned if/else yet, so don't use it.

Try to solve it using only what you've learned so far. If you can't, that's okay — the challenge is partly designed to make you notice what you haven't learned yet.

 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    
        let response = confirm("Are you learning JavaScript?");

response && alert("Great! Keep learning!");
response || alert("No problem. You can start anytime!");
    </script>
</body>
</html>
